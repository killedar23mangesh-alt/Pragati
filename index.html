<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragati-AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #111827; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1d4ed8; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        #voiceToggle { background-color: #2563eb; border: 1px solid #93c5fd; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
        .api-bar { background-color: #1f2937; padding: 10px; display: flex; gap: 8px; border-bottom: 1px solid #374151; }
        .api-bar input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #4b5563; background: #374151; color: white; outline: none; }
        .api-bar button { background-color: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #chatBox { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 12px 15px; border-radius: 15px; line-height: 1.4; font-size: 0.95rem; word-wrap: break-word; }
        .ai-msg { background-color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #374151; }
        .user-msg { background-color: #2563eb; align-self: flex-end; border-bottom-right-radius: 2px; }
        .error-msg { background-color: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; align-self: flex-start; }
        .input-area { background-color: #1f2937; padding: 10px; display: flex; gap: 8px; align-items: center; }
        #micBtn { background-color: #ef4444; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; }
        #micBtn.listening { background-color: #10b981; animation: pulse 1s infinite; }
        #userInput { flex: 1; padding: 12px 15px; border-radius: 25px; border: none; background: #374151; color: white; outline: none; font-size: 1rem; }
        #sendBtn { background-color: #2563eb; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <h1>✨ Pragati-AI</h1>
        <button id="voiceToggle" onclick="toggleVoice()">🔊 Voice: ON</button>
    </header>

    <div class="api-bar">
        <input type="password" id="apiKeyInput" placeholder="येथे तुमची Gemini API Key पेस्ट करा...">
        <button onclick="saveApiKey()">Save</button>
    </div>

    <div id="chatBox">
        <div class="msg ai-msg">नमस्कार! मी तुमचा <b>Pragati-AI</b> असिस्टंट आहे. वर तुमची API Key सेव्ह करा आणि खाली टाइप करा किंवा माइक दाबून बोला!</div>
    </div>

    <div class="input-area">
        <button id="micBtn" onclick="startListening()" title="बोला">🎤</button>
        <input type="text" id="userInput" placeholder="तुमचा प्रश्न विचारा..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()" title="पाठवा">➤</button>
    </div>

    <script>
        let isVoiceOn = true;
        const chatBox = document.getElementById('chatBox');
        const apiKeyInput = document.getElementById('apiKeyInput');

        window.onload = () => {
            const savedKey = localStorage.getItem('pragati_api_key');
            if (savedKey) apiKeyInput.value = savedKey;
        };

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert("कृपया आधी API Key टाका!");
                return;
            }
            localStorage.setItem('pragati_api_key', key);
            alert("API Key यशस्वीरित्या सेव्ह झाली आहे!");
        }

        function toggleVoice() {
            isVoiceOn = !isVoiceOn;
            document.getElementById('voiceToggle').innerText = isVoiceOn ? "🔊 Voice: ON" : "🔇 Voice: OFF";
            if (!isVoiceOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.innerHTML = text.replace(/\n/g, '<br>');
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function speakText(text) {
            if (!isVoiceOn || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/[*#_`]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'mr-IN';
            utterance.rate = 1;
            window.speechSynthesis.speak(utterance);
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const userText = inputField.value.trim();
            const apiKey = localStorage.getItem('pragati_api_key') || apiKeyInput.value.trim();

            if (!userText) return;

            if (!navigator.onLine) {
                addMessage("❌ तुमच्या फोनचे इंटरनेट बंद आहे. कृपया डेटा किंवा Wi-Fi चालू करा.", "error-msg");
                return;
            }

            if (!apiKey) {
                addMessage("⚠️ कृपया वरच्या बॉक्समध्ये तुमची Gemini API Key पेस्ट करून 'Save' बटन दाबा.", "error-msg");
                return;
            }

            addMessage(userText, 'user-msg');
            inputField.value = '';
            const loadingDiv = addMessage("विचार करत आहे...", 'ai-msg');

            try {
                const response = await fetch(`https://googleapis.com{apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "तुझे नाव Pragati-AI आहे. वापरकर्त्याला सोप्या आणि स्पष्ट भाषेत उत्तर दे: " + userText }] }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || "API कडून प्रतिसाद मिळाला नाही.");
                }

                // दुरुस्त केलेली ओळ (Array index [0] सह)
                if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    loadingDiv.innerHTML = aiReply.replace(/\n/g, '<br>');
                    speakText(aiReply);
                } else {
                    throw new Error("AI कडून रिकामा प्रतिसाद आला. कृपया पुन्हा प्रयत्न करा.");
                }

            } catch (error) {
                loadingDiv.className = 'msg error-msg';
                loadingDiv.innerText = "❌ एरर: " + error.message;
            }
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("तुमच्या ब्राउझरमध्ये Voice Typing सपोर्ट करत नाही. कृपया Google Chrome वापरा.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'mr-IN';
            const micBtn = document.getElementById('micBtn');

            recognition.onstart = () => { micBtn.classList.add('listening'); };
            recognition.onend = () => { micBtn.classList.remove('listening'); };

            recognition.onresult = (event) => {
                // दुरुस्त केलेली ओळ (Array index [0][0] सह)
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                sendMessage();
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                alert("माइक एरर: " + event.error + " (कृपया Chrome ला Mic ची परवानगी द्या)");
            };

            recognition.start();
        }
    </script>
</body>
</html>
